<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CoreID 注册测试</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3f0ea;
        --panel: rgba(255, 255, 255, 0.88);
        --text: #172027;
        --muted: #5d6973;
        --line: rgba(23, 32, 39, 0.1);
        --accent: #1e624b;
        --accent-soft: rgba(30, 98, 75, 0.12);
        --danger: #bb3e2d;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "PingFang SC", "Noto Sans SC", sans-serif;
        background:
          radial-gradient(circle at top left, rgba(30, 98, 75, 0.14), transparent 35%),
          linear-gradient(180deg, #f8f5ef 0%, var(--bg) 100%);
        color: var(--text);
      }

      .shell {
        width: min(920px, calc(100vw - 32px));
        margin: 32px auto;
        display: grid;
        gap: 18px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 24px;
        box-shadow: 0 18px 60px rgba(20, 25, 33, 0.08);
        backdrop-filter: blur(18px);
      }

      .hero {
        padding: 28px 30px;
      }

      .hero h1 {
        margin: 0 0 10px;
        font-size: 34px;
      }

      .hero p {
        margin: 0;
        color: var(--muted);
        line-height: 1.7;
      }

      .grid {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 18px;
      }

      .form-card,
      .result-card {
        padding: 24px;
      }

      .stack {
        display: grid;
        gap: 14px;
      }

      label {
        display: grid;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
      }

      input,
      select,
      textarea,
      button {
        font: inherit;
      }

      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid rgba(23, 32, 39, 0.12);
        background: rgba(255, 255, 255, 0.9);
        color: var(--text);
        border-radius: 16px;
        padding: 13px 14px;
      }

      textarea {
        min-height: 260px;
        resize: vertical;
        font-family: "SFMono-Regular", "Menlo", monospace;
        font-size: 12px;
        line-height: 1.6;
      }

      .row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        align-items: end;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 12px 18px;
        cursor: pointer;
        transition: transform 160ms ease, opacity 160ms ease;
      }

      button:hover {
        transform: translateY(-1px);
      }

      .primary {
        background: var(--accent);
        color: #fff;
      }

      .secondary {
        background: var(--accent-soft);
        color: var(--accent);
      }

      .hint {
        padding: 14px 16px;
        border-radius: 16px;
        background: rgba(23, 32, 39, 0.04);
        color: var(--muted);
        font-size: 13px;
        line-height: 1.7;
      }

      .status {
        padding: 14px 16px;
        border-radius: 16px;
        font-size: 13px;
        line-height: 1.7;
      }

      .status.info {
        background: rgba(30, 98, 75, 0.08);
        color: var(--accent);
      }

      .status.error {
        background: rgba(187, 62, 45, 0.1);
        color: var(--danger);
      }

      .actions {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
      }

      a {
        color: inherit;
      }

      @media (max-width: 860px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <section class="panel hero">
        <h1>CoreID 注册测试页</h1>
        <p>
          这里模拟“应用自己的注册页”。当前只做手机号主凭证；验证码支持开发模式假验证码，也支持真实短信模式。
          注册成功后只会开通当前选中的应用资格，不会自动开通其它应用。
        </p>
      </section>

      <section class="grid">
        <div class="panel form-card">
          <div class="stack">
            <label>
              目标应用
              <select id="app-id">
                <option value="">加载中…</option>
              </select>
            </label>

            <label>
              手机号
              <input id="phone" type="text" placeholder="例如 13900000001" />
            </label>

            <div class="row">
              <label>
                验证码
                <input id="code" type="text" placeholder="发送后填写收到的验证码" />
              </label>
              <button class="secondary" id="send-code-btn" type="button">发送验证码</button>
            </div>

            <label>
              密码
              <input id="password" type="password" placeholder="至少 6 位" />
            </label>

            <label>
              展示名
              <input id="display-name" type="text" placeholder="可留空，默认使用手机号" />
            </label>

            <div class="actions">
              <button class="primary" id="register-btn" type="button">注册当前应用</button>
              <a class="secondary" href="/auth/login-test" style="text-decoration: none; display: inline-flex; align-items: center;">
                去登录测试页
              </a>
            </div>

            <div class="hint">
              测试规则：
              <br />
              1. 先在 `vidget` 注册，再去登录页尝试 `zhujiaoyun`，应该会被拒绝。
              <br />
              2. 再回来给同一手机号注册 `zhujiaoyun`，之后它就能登录 `zhujiaoyun`。
              <br />
              3. 如果接口返回 <code>mode=dev</code>，当前验证码会自动回填；如果返回 <code>mode=sms</code>，请填写手机收到的真实验证码。
            </div>

            <div id="status-box" class="status info">等待操作。</div>
          </div>
        </div>

        <div class="panel result-card">
          <div class="stack">
            <strong>最近一次接口返回</strong>
            <textarea id="result" readonly>{}</textarea>
          </div>
        </div>
      </section>
    </main>

    <script>
      const appIdInput = document.getElementById("app-id");
      const phoneInput = document.getElementById("phone");
      const codeInput = document.getElementById("code");
      const passwordInput = document.getElementById("password");
      const displayNameInput = document.getElementById("display-name");
      const resultEl = document.getElementById("result");
      const statusBox = document.getElementById("status-box");

      function setStatus(message, type = "info") {
        statusBox.textContent = message;
        statusBox.className = `status ${type}`;
      }

      function setResult(payload) {
        resultEl.value = JSON.stringify(payload, null, 2);
      }

      async function loadApplications() {
        const payload = await requestJson("/api/identity/applications");
        appIdInput.innerHTML = payload.items.length
          ? payload.items
              .map(
                (item) =>
                  `<option value="${item.id}">${item.name || item.id} · ${item.id}</option>`
              )
              .join("")
          : '<option value="">暂无可用应用</option>';
      }

      async function requestJson(url, options = {}) {
        const response = await fetch(url, {
          method: options.method || "GET",
          headers: {
            "Content-Type": "application/json",
            ...(options.headers || {}),
          },
          body: options.body ? JSON.stringify(options.body) : undefined,
          credentials: "same-origin",
        });

        const text = await response.text();
        let payload = {};

        try {
          payload = text ? JSON.parse(text) : {};
        } catch (error) {
          payload = { raw: text };
        }

        if (!response.ok) {
          const message = payload.error || payload.msg || `请求失败 (${response.status})`;
          throw new Error(message);
        }

        return payload;
      }

      document.getElementById("send-code-btn").addEventListener("click", async () => {
        try {
          setStatus("验证码发送中...");
          const payload = await requestJson("/api/identity/send-code", {
            method: "POST",
            body: {
              app_id: appIdInput.value,
              phone: phoneInput.value,
              purpose: "register",
            },
          });
          setResult(payload);
          if (payload.mode === "dev") {
            codeInput.value = payload.debug_code || "";
            setStatus(`验证码已生成，当前开发固定码：${payload.debug_code || ""}`);
          } else {
            codeInput.value = "";
            setStatus("验证码已发送到手机，请输入短信里的验证码。");
          }
        } catch (error) {
          setStatus(error.message, "error");
        }
      });

      document.getElementById("register-btn").addEventListener("click", async () => {
        try {
          setStatus("注册中...");
          const payload = await requestJson("/api/identity/register", {
            method: "POST",
            body: {
              app_id: appIdInput.value,
              phone: phoneInput.value,
              code: codeInput.value,
              password: passwordInput.value,
              display_name: displayNameInput.value,
            },
          });
          setResult(payload);
          if (payload.account_existed) {
            setStatus("当前手机号原本就有统一账号，这次只新增了目标应用资格。");
          } else {
            setStatus("注册成功，当前手机号已经拥有该应用资格。");
          }
        } catch (error) {
          setStatus(error.message, "error");
        }
      });

      loadApplications().catch((error) => {
        setStatus(error.message, "error");
      });
    </script>
  </body>
</html>
