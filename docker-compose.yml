services:
  postgres:
    image: postgres:16-alpine
    container_name: coreid-postgres
    environment:
      POSTGRES_DB: coreid
      POSTGRES_USER: coreid
      POSTGRES_PASSWORD: coreid
    ports:
      - "55432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coreid -d coreid"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: coreid-app
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - "3000:3000"
    volumes:
      - ./public:/app/public
      - ./src:/app/src
      - ./src/uploads:/app/src/uploads
      - ./package.json:/app/package.json

volumes:
  postgres_data:
