    --panel2:  #0f1e3a;
    --accent:  #f5c518;
    --text:    #e8eaf0;
    --dim:     #8fa0bc;
    --border:  rgba(100,160,255,0.18);
    --bar:     #f5c518;
    --red:     #ff4040;
    --blue:    #5b9ec9;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {

    color: var(--text);
    font-family: 'Noto Sans SC', 'Microsoft YaHei', sans-serif;
    padding: 16px;
    min-height: 100vh;
  }

  .main-title {
    text-align: center;
    font-size: 28px;
    font-weight: 900;
    letter-spacing: 4px;
    padding: 16px 0 12px;
    background: linear-gradient(135deg, #f5c518 0%, #fff8a0 50%, #f5c518 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .main-title::after {
    content: '';
    display: block;
    width: 180px; height: 2px;
    background: linear-gradient(90deg, transparent, #f5c518, transparent);
    margin: 8px auto 0;
  }

  .tab-bar {
    display: flex; gap: 8px; flex-wrap: wrap;
    justify-content: center; margin: 14px 0 16px;
  }
  .tab-btn {
    padding: 7px 20px;
    border-radius: 20px;
    border: 1.5px solid var(--border);
    background: var(--panel);
    color: var(--dim);
    font-size: 13px; font-weight: 700;
    cursor: pointer; transition: all .2s;
    font-family: inherit; letter-spacing: 1px;
  }
  .tab-btn:hover { border-color: var(--accent); color: var(--accent); }
  .tab-btn.active {
    background: var(--accent); color: #0a1628;
    border-color: var(--accent);
    box-shadow: 0 0 16px rgba(245,197,24,0.4);
  }

  .student-card { display: none; }
  .student-card.active { display: block; }

  .stu-header {
    background: #071020;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 20px; margin-bottom: 14px;
  }
  .stu-name { font-size: 20px; font-weight: 900; color: var(--accent); letter-spacing: 2px; }
  .stu-class { display: none; }

  .tbl-wrap {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden; margin-bottom: 16px;
    overflow-x: auto;
  }
  .tbl-wrap table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl-wrap th {
    background: #081528; color: var(--accent);
    padding: 7px 10px; text-align: center;
    font-weight: 700; white-space: nowrap;
    border-bottom: 1px solid var(--border);
  }
  .tbl-wrap th.rk { color: var(--blue); background: #06101e; }
  .tbl-wrap td {
    padding: 7px 10px; text-align: center;
    border-bottom: 1px solid rgba(255,255,255,0.04);
    white-space: nowrap;
  }
  .tbl-wrap tr:last-child td { border-bottom: none; }
  .tbl-wrap tr:nth-child(even) td { background: rgba(255,255,255,0.025); }
  .tbl-wrap td.ex  { color: #ffdd55; font-weight: 700; }
  .tbl-wrap td.rk  { color: var(--blue); font-size: 12px; }
  .tbl-wrap td.tot { color: #ff9f43; font-weight: 900; font-size: 14px; }

  .charts-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .chart-full { grid-column: 1 / -1; }

  .chart-box {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 12px 8px;
  }
  .chart-head {
    display: flex; align-items: center; gap: 8px;
    font-size: 12px; color: var(--dim);
    margin-bottom: 6px; flex-wrap: wrap;
  }
  .chart-head .subj { color: var(--accent); font-size: 14px; font-weight: 900; }
  .lgd { display: flex; align-items: center; gap: 4px; font-size: 11px; }
  .lgd-bar { width: 12px; height: 10px; background: var(--bar); border-radius: 2px; }
  .lgd-line { width: 18px; height: 0; border-top: 2.5px solid var(--red); position: relative; }
  .lgd-line::after {
    content: ''; position: absolute;
    left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--red); border: 1.5px solid #fff;
  }

  /* SVG: width 100%, height driven by viewBox aspect ratio */
  .chart-svg { width: 100%; display: block; }

  /* ── Selector Button & Modal ── */
  .selector-bar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 16px; flex-wrap: wrap;
  }
  .open-selector-btn {
    display: flex; align-items: center; gap: 8px;
    padding: 9px 20px; border-radius: 22px; font-size: 14px;
    font-weight: 700; cursor: pointer; font-family: inherit;
    border: 1.5px solid var(--accent);
    background: rgba(245,197,24,0.1); color: var(--accent);
    transition: all .2s; letter-spacing: 1px;
  }
  .open-selector-btn:hover {
    background: rgba(245,197,24,0.2);
    box-shadow: 0 0 14px rgba(245,197,24,0.3);
  }
  .open-selector-btn .arrow { font-size: 10px; transition: transform .2s; }
  .open-selector-btn.open .arrow { transform: rotate(180deg); }
  .sel-summary {
    font-size: 12px; color: var(--dim);
  }
  .sel-summary span { color: var(--accent); font-weight: 700; }

  /* Modal overlay */
  .modal-overlay {
    display: none; position: fixed;
    inset: 0; z-index: 1000;
    background: rgba(0,0,0,0.55);
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: block; }

  /* Modal box */
  .modal-box {
    position: fixed; z-index: 1001;
    top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: min(560px, 92vw);
    background: linear-gradient(160deg, #0d1f3c 0%, #071020 100%);
    border: 1.5px solid rgba(100,160,255,0.25);
    border-radius: 16px;
    box-shadow: 0 24px 64px rgba(0,0,0,0.7);
    overflow: hidden;
    display: none;
  }
  .modal-box.open { display: block; }

  .modal-header {
    display: flex; align-items: center;
    justify-content: space-between;
    padding: 14px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.07);
    background: rgba(0,0,0,0.2);

  .modal-title { font-size: 15px; font-weight: 900; color: var(--accent); letter-spacing: 1px; }
  .modal-close {
    width: 28px; height: 28px; border-radius: 50%;
    border: 1px solid var(--border); background: transparent;
    color: var(--dim); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all .15s; line-height: 1;
  }
  .modal-close:hover { border-color: var(--accent); color: var(--accent); }

  .modal-actions {
    display: flex; gap: 8px; align-items: center;
    padding: 10px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .m-action-btn {
    padding: 4px 14px; border-radius: 14px; font-size: 12px;
    font-weight: 700; cursor: pointer; font-family: inherit;
    border: 1.5px solid var(--border); background: transparent;
    color: var(--dim); transition: all .15s;

  .m-action-btn:hover { border-color: var(--accent); color: var(--accent); }
  .m-count { font-size: 12px; color: var(--dim); margin-left: auto; }

    padding: 14px 18px;
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    max-height: 340px; overflow-y: auto;
  }
  .modal-list::-webkit-scrollbar { width: 4px; }
  .modal-list::-webkit-scrollbar-track { background: transparent; }
  .modal-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }

    display: flex; align-items: center; gap: 8px;
    padding: 7px 10px; border-radius: 8px; cursor: pointer;
    border: 1.5px solid var(--border);
    background: var(--panel2);
    transition: all .15s; user-select: none;

  .chk-item.checked {

    width: 16px; height: 16px; border-radius: 4px; flex-shrink: 0;

    pointer-events: none;
    display: none;
    z-index: 9999;
    background: linear-gradient(135deg, #0d1f3c 0%, #112244 100%);

    margin-bottom: 6px;

  .tip-row {
    display: flex; align-items: center;
    gap: 8px; margin-top: 5px; font-size: 13px;

  .tip-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .tip-label { color: #8fa0bc; font-size: 12px; }
  .tip-val { font-weight: 700; margin-left: auto; }
</style>
</head>

/* ── Default selected names ── */
const DEFAULT_SELECTED = new Set([
  '王加茹','王子浩','郑皓文','梁聪颖','董一晴','吴煜楠','支朵朵',
  '王靖凯','盛忆欣','郑琬蓉','朱佳懿','张钰倩','梁宇博'
]);

/* ── State ── */
const tabBar    = document.getElementById('tabBar');
const cardsEl   = document.getElementById('cards');
const noSelHint = document.getElementById('noSelHint');
const modalList = document.getElementById('modalList');
const modalCount= document.getElementById('modalCount');
const selSummary= document.getElementById('selSummary');
const openBtn   = document.getElementById('openSelectorBtn');

// confirmed selection (drives tabs)
let selectedIndices = new Set();
// temp selection inside modal (not applied until Confirm)
let tempSelected = new Set();
let activeTabSI = -1;

/* ── Pre-build all cards ── */
STUDENTS.forEach((stu, si) => {
  const card = document.createElement('div');
  card.className = 'student-card';
  card.id = 'card-' + si;
  card.innerHTML = buildCard(stu, si);
  cardsEl.appendChild(card);
});

/* ── Build modal checklist ── */
STUDENTS.forEach((stu, si) => {
  const item = document.createElement('div');
  item.className = 'chk-item' + (DEFAULT_SELECTED.has(stu.name) ? ' checked' : '');
  item.dataset.si = si;
  item.innerHTML = `<span class="chk-box">✓</span><span class="chk-name">${stu.name}</span>`;
  item.onclick = () => toggleModalItem(item, si);
  modalList.appendChild(item);
});

function toggleModalItem(item, si) {
  if (tempSelected.has(si)) {
    tempSelected.delete(si);
    item.classList.remove('checked');
  } else {
    tempSelected.add(si);
    item.classList.add('checked');
  }
  modalCount.textContent = tempSelected.size;
}

function modalSelectAll() {
  STUDENTS.forEach((_, si) => tempSelected.add(si));
  modalList.querySelectorAll('.chk-item').forEach(el => el.classList.add('checked'));
  modalCount.textContent = tempSelected.size;
}

function modalClearAll() {
  tempSelected.clear();
  modalList.querySelectorAll('.chk-item').forEach(el => el.classList.remove('checked'));
  modalCount.textContent = 0;
}

function openModal() {
  // Sync tempSelected from current confirmed selection
  tempSelected = new Set(selectedIndices);
  modalList.querySelectorAll('.chk-item').forEach(el => {
    const si = parseInt(el.dataset.si);
    el.classList.toggle('checked', tempSelected.has(si));
  });
  modalCount.textContent = tempSelected.size;
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalBox').classList.add('open');
  openBtn.classList.add('open');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.getElementById('modalBox').classList.remove('open');
  openBtn.classList.remove('open');
}

function confirmSelection() {
  selectedIndices = new Set(tempSelected);
  closeModal();
  rebuildTabs();
}

function rebuildTabs() {
  tabBar.innerHTML = '';
  const selArr = Array.from(selectedIndices);

  // Update summary text
  selSummary.textContent = selArr.length > 0
    ? selArr.map(si => STUDENTS[si].name).join('、')
    : '未选择';

  if (selArr.length === 0) {
    noSelHint.style.display = 'block';
    document.querySelectorAll('.student-card').forEach(c => c.classList.remove('active'));
    activeTabSI = -1;
    return;
  }
  noSelHint.style.display = 'none';

  if (!selectedIndices.has(activeTabSI)) activeTabSI = selArr[0];

  selArr.forEach(si => {
    const btn = document.createElement('button');
    btn.className = 'tab-btn' + (si === activeTabSI ? ' active' : '');
    btn.textContent = STUDENTS[si].name;
    btn.onclick = () => switchTab(si);
    tabBar.appendChild(btn);
  });

  document.querySelectorAll('.student-card').forEach(c => c.classList.remove('active'));
  document.getElementById('card-' + activeTabSI).classList.add('active');
  requestAnimationFrame(() => drawStudent(activeTabSI));
}

window.addEventListener('load', () => {
  // Apply defaults
  STUDENTS.forEach((stu, si) => {
    if (DEFAULT_SELECTED.has(stu.name)) selectedIndices.add(si);
  });
  tempSelected = new Set(selectedIndices);
  rebuildTabs();
});

function switchTab(si) {
  activeTabSI = si;
  tabBar.querySelectorAll('.tab-btn').forEach(b => {
    b.classList.toggle('active', b.textContent === STUDENTS[si].name);
  });
  document.querySelectorAll('.student-card').forEach(c => c.classList.remove('active'));
  document.getElementById('card-' + si).classList.add('active');
  requestAnimationFrame(() => drawStudent(si));
}

/* ── Card HTML ── */
function buildCard(stu, si) {
  return `
    <div class="stu-header">
      <div class="stu-name">${stu.name}</div>
      <div class="stu-class">${stu.cls}</div>
    </div>
    ${buildTable(stu)}
    <div class="charts-grid">
      <div class="chart-box chart-full">
        ${head('综合','全科总分 &amp; 全校排名趋势')}
        <svg class="chart-svg" id="svg-${si}-total"></svg>
      </div>
      ${SUBJS.map((s,j) => `
        <div class="chart-box">
          ${head(s, s+' 成绩 &amp; 校排趋势')}
          <svg class="chart-svg" id="svg-${si}-${j}"></svg>
        </div>`).join('')}
    </div>`;
}

function head(subj, label) {
  return `<div class="chart-head">
    <span class="subj">${subj}</span>
    <span>${label}</span>
    <span class="lgd"><span class="lgd-bar"></span>分数</span>
    <span class="lgd"><span class="lgd-line"></span>校排</span>
  </div>`;
}

/* ── Table ── */
function buildTable(stu) {
  const thS = SUBJS.map(s=>`<th>${s}</th>`).join('');
  const thR = SUBJS.map(s=>`<th class="rk">${s}排</th>`).join('');
  const rows = EXAMS.map((ex,ei) => {
    const sc = stu.scores[ei].map(v=>`<td>${v}</td>`).join('');
    const rk = stu.ranks[ei].map(v=>`<td class="rk">${v}</td>`).join('');
    return `<tr><td class="ex">${ex}</td>${sc}${rk}<td class="tot">${stu.total[ei]}</td></tr>`;
  }).join('');
  return `<div class="tbl-wrap"><table>
    <thead>
      <tr>
        <th rowspan="2" style="width:76px">考试</th>
        <th colspan="${SUBJS.length}">各科成绩</th>
        <th colspan="${SUBJS.length}" class="rk">各科校排</th>
        <th rowspan="2" style="color:#ff9f43">全校排名</th>
      </tr>
      <tr>${thS}${thR}</tr>
    </thead>
    <tbody>${rows}</tbody>
  </table></div>`;
}

/* ── Draw all charts for student si ── */
function drawStudent(si) {
  const stu = STUDENTS[si];
  const totals = stu.scores.map(r => r.reduce((a,b)=>a+b,0));

  // Total chart — taller
  renderChart(`svg-${si}-total`, totals, stu.total, 650, 350, 600, 170, '全科总分');

  // Subject charts
  SUBJS.forEach((subj, j) => {
    const sMax = subj==='数学'?135 : subj==='外语'?130 : 120;
    renderChart(`svg-${si}-${j}`, stu.scores.map(r=>r[j]), stu.ranks.map(r=>r[j]),
      sMax, 350, 600, 155, subj);
  });
}

/* ── Tooltip ── */
const tip      = document.getElementById('tooltip');
const tipExam  = document.getElementById('tip-exam');
const tipSubjL = document.getElementById('tip-subj-label');
const tipScore = document.getElementById('tip-score');
const tipRank  = document.getElementById('tip-rank');

function showTip(e, exam, subjLabel, score, rank) {
  tipExam.textContent  = exam;
  tipSubjL.textContent = subjLabel;
  tipScore.textContent = score;
  tipRank.textContent  = '第 ' + rank + ' 名';
  tip.classList.add('visible');
  moveTip(e);
}
function moveTip(e) {
  const x = e.clientX, y = e.clientY;
  const tw = tip.offsetWidth, th = tip.offsetHeight;
  const wx = window.innerWidth,  wy = window.innerHeight;
  tip.style.left = (x + 16 + tw > wx ? x - tw - 12 : x + 16) + 'px';
  tip.style.top  = (y + 16 + th > wy ? y - th - 12 : y + 16) + 'px';
}
function hideTip() { tip.classList.remove('visible'); }
document.addEventListener('mousemove', e => {
  if (tip.classList.contains('visible')) moveTip(e);
});

/* ── Core SVG chart renderer ──
   VW/VH = logical coordinate space (fixed).
   CSS width:100% + viewBox = auto-scaling with correct aspect ratio.
   No DOM measurements needed → works even on hidden cards.
*/
function renderChart(id, scores, ranks, scoreMax, rankMax, VW, VH, subjLabel) {
  const svg = document.getElementById(id);
  if (!svg) return;

  svg.setAttribute('viewBox', `0 0 ${VW} ${VH}`);
  svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
  svg.setAttribute('height', VH);

  const P  = { t:34, b:28, l:40, r:46 };
  const cW = VW - P.l - P.r;
  const cH = VH - P.t - P.b;
  const N  = scores.length;
  const gap = cW / (N + 1);
  const bW  = gap * 0.54;

  const xOf  = i => P.l + gap * (i + 1);
  const yOfS = v => P.t + cH - (v / scoreMax) * cH;
  const yOfR = v => P.t + ((v - 1) / Math.max(rankMax - 1, 1)) * cH;

  let h = '';

  /* grid */
  for (let g = 0; g <= 4; g++) {
    const yy  = P.t + (g / 4) * cH;
    const val = Math.round(scoreMax * (1 - g / 4));
    h += `<line x1="${P.l}" y1="${yy}" x2="${P.l+cW}" y2="${yy}"
            stroke="rgba(255,255,255,0.07)" stroke-width="1"/>`;
    h += `<text x="${P.l-4}" y="${yy+4}" text-anchor="end"
            fill="#607898" font-size="10">${val}</text>`;
  }

  /* right rank axis */
  [1, Math.round(rankMax*.25), Math.round(rankMax*.5),
   Math.round(rankMax*.75), rankMax].forEach(rv => {
    h += `<text x="${P.l+cW+5}" y="${yOfR(rv)+4}" text-anchor="start"
            fill="#4a7ea0" font-size="10">${rv}</text>`;
  });

  /* baseline */
  h += `<line x1="${P.l}" y1="${P.t+cH}" x2="${P.l+cW}" y2="${P.t+cH}"
          stroke="rgba(255,255,255,0.2)" stroke-width="1"/>`;

  /* bars + score labels */
  scores.forEach((s, i) => {
    const cx = xOf(i);
    const bH = (s / scoreMax) * cH;
    const bY = P.t + cH - bH;
    // Bar with data attributes for tooltip
    h += `<rect class="tip-bar" x="${cx-bW/2}" y="${bY}" width="${bW}" height="${bH}"
            fill="#f5c518" rx="2" opacity="0.9"
            data-exam="${EXAMS[i]}" data-score="${s}" data-rank="${ranks[i]}"
            style="cursor:pointer"/>`;
    // Score label above bar
    const sly = Math.max(bY - 7, 14);
    h += `<text x="${cx}" y="${sly}" text-anchor="middle"
            fill="#ffe566" font-size="13" font-weight="700" style="pointer-events:none">${s}</text>`;
  });

  /* rank line */
  const pts = ranks.map((r,i) => `${xOf(i)},${yOfR(r)}`).join(' ');
  h += `<polyline points="${pts}" fill="none" stroke="#ff3535"
          stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"
          style="pointer-events:none"/>`;

  /* rank dots + labels */
  ranks.forEach((r, i) => {
    const cx = xOf(i);
    const cy = yOfR(r);
    // Larger invisible hit area for dot
    h += `<circle class="tip-dot-hit" cx="${cx}" cy="${cy}" r="14"
            fill="transparent" style="cursor:pointer"
            data-exam="${EXAMS[i]}" data-score="${scores[i]}" data-rank="${r}"/>`;
    // Visible dot
    h += `<circle cx="${cx}" cy="${cy}" r="5"
            fill="#ff3535" stroke="#fff" stroke-width="1.5" style="pointer-events:none"/>`;

    // Rank label offset left/right
    const offsetX = i === 0 ? -(bW/2 + 22) : (bW/2 + 6);
    const lx = cx + offsetX;
    const above = cy > P.t + cH * 0.35;
    const ly = above ? cy - 9 : cy + 19;
    const labelW = String(r).length * 8 + 8;
    h += `<rect x="${lx - labelW/2}" y="${ly-13}" width="${labelW}" height="15"
            fill="rgba(5,12,28,0.88)" rx="3" style="pointer-events:none"/>`;
    h += `<text x="${lx}" y="${ly-1}" text-anchor="middle"
            fill="#ff7070" font-size="12" font-weight="700" style="pointer-events:none">${r}</text>`;
  });

  /* x-axis labels */
  EXAMS.forEach((ex, i) => {
    h += `<text x="${xOf(i)}" y="${P.t+cH+20}" text-anchor="middle"
            fill="#7888a8" font-size="11">${ex}</text>`;
  });

  svg.innerHTML = h;

  // Attach tooltip events after innerHTML set
  svg.querySelectorAll('.tip-bar, .tip-dot-hit').forEach(el => {
    el.addEventListener('mouseenter', e => {
      showTip(e, el.dataset.exam, subjLabel, el.dataset.score + '分', el.dataset.rank);
      // highlight bar on hover
      if (el.classList.contains('tip-bar')) el.setAttribute('opacity','1');
    });
    el.addEventListener('mouseleave', () => {
      hideTip();
      if (el.classList.contains('tip-bar')) el.setAttribute('opacity','0.9');
    });
  });
}
